<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas de um Estudante de Direito</title>

<style>
:root{
  --bg:#f7f7f5;
  --paper:#ffffff;
  --ink:#1f1f1f;
  --muted:#666;
  --line:#deded8;
}

body{
  margin:0;
  font-family: Georgia, "Times New Roman", serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.7;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:0 24px;
}

header{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.nav{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand{
  font-weight:bold;
}
  .menu-topo{
  display:flex;
  align-items:center;
}

.menu-botao{
  background:none;
  border:1px solid #000;
  padding:6px 10px;
  font-size:24px;
  cursor:pointer;
}
  .menu-header{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  margin-bottom:20px;
}

.menu-fechar{
  background:none;
  border:none;
  font-size:28px;
  cursor:pointer;
}

.menu-links{
  position: fixed;
  top: 0;
  left: 0;
  width: 280px;
  height: 100vh;
  background: #fff;
  border-right: 1px solid #ddd;
  padding: 80px 25px 25px;
  box-shadow: 4px 0 10px rgba(0, 0, 0, 0.12);
  z-index: 9999;
  transform: translateX(-100%);
  transition: transform 0.3s ease;
}

.menu-links.active{
  transform: translateX(0);
}

.menu-links a{
  display: block;
  margin: 14px 0;
  font-size: 22px;
  text-decoration: none;
  color: #000;
}

section{
  padding:100px 0;
}

.hero h1{
  font-size:42px;
}

.section-title{
  font-size:28px;
  margin-bottom:10px;
}

.section-text{
  color:#666;
  max-width:700px;
}

.grid{
  display:grid;
  gap:20px;
  margin-top:20px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  border:1px solid #ddd;
}

.post-title{
  font-size:20px;
}

.contato-home{
  margin-top:36px;
  max-width:620px;
  padding:22px 24px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
}

.contato-home strong{
  display:block;
  margin-bottom:6px;
  font-size:18px;
}

.contato-home p{
  margin:0;
  color:var(--muted);
}

.contato-home a{
  color:var(--ink);
  text-decoration:none;
  border-bottom:1px solid var(--ink);
}
</style>
</head>

<body>
<div id="header-container"></div>
<main class="wrap">
<!-- INÍCIO -->
<section id="inicio" class="hero">
  <span>João Victor B. N.</span>
<h1>Notas de um Estudante de Direito</h1>
<p>
  Direito, filosofia e formação intelectual.
</p>

<div class="contato-home">
  <strong>Contato acadêmico e institucional</strong>
  <p>Para contato acadêmico, institucional ou profissional, escreva para <a href="mailto:joaovictorbrandonovais@gmail.com">joaovictorbrandonovais@gmail.com</a>.</p>
</div>
</section>
<!-- SOBRE -->
</main>
  <script>
  fetch("/header.html")
    .then(response => {
      if (!response.ok) {
        throw new Error("Erro ao carregar o header");
      }
      return response.text();
    })
    .then(data => {
      document.getElementById("header-container").innerHTML = data;
      iniciarMenu();
    })
    .catch(error => {
      console.error(error);
    });
</script>
<script src="/menu.js"></script>
</body>
</html>
